name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.12", "3.11", "3.10"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Test core
        run: uv run --package plugmut pytest mutmut/tests/ --ignore=mutmut/tests/e2e/ -x

      - name: Test extras
        run: uv run --package plugmut-extras pytest plugmut-extras/tests/ --ignore=plugmut-extras/tests/e2e/

      - name: Test dedup
        run: uv run --package plugmut-dedup pytest plugmut-dedup/tests/

      - name: Test llm (unit only)
        run: uv run --package plugmut-llm pytest plugmut-llm/tests/ --ignore=plugmut-llm/tests/e2e/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Core e2e
        run: uv run --package plugmut pytest mutmut/tests/e2e/ -x

      - name: Extras e2e
        run: uv run --package plugmut-extras pytest plugmut-extras/tests/e2e/ -x

      - name: LLM e2e (no live API)
        run: uv run --package plugmut-llm pytest plugmut-llm/tests/e2e/ -x --ignore=plugmut-llm/tests/e2e/test_e2e_live.py

    timeout-minutes: 20
