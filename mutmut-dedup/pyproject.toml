[project]
name = "mutmut-dedup"
version = "0.1.0"
description = "Structural deduplication plugin for mutmut"
requires-python = ">=3.10"

dependencies = [
    "mutmut>=3.5.0",
    "pluggy>=1.5.0",
]

[project.entry-points.mutmut]
dedup = "mutmut_dedup.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_dedup"]

[tool.uv.sources]
mutmut = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
]
