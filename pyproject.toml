[project]
name = "mutmut2-workspace"
version = "0.1.0"
description = "LLM-enhanced mutation testing workspace"
requires-python = ">=3.10"
dependencies = [
    "mutmut",
    "mutmut-extras",
    "mutmut-llm",
]

[tool.uv.sources]
mutmut = { workspace = true }
mutmut-extras = { workspace = true }
mutmut-llm = { workspace = true }

[tool.uv.workspace]
members = ["mutmut", "mutmut-extras", "mutmut-llm"]
exclude = ["mutmut/e2e_projects/*"]
