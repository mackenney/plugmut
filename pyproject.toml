[project]
name = "mutmut2-workspace"
version = "0.1.0"
description = "LLM-enhanced mutation testing workspace"
requires-python = ">=3.10"
dependencies = [
    "plugmut",
    "plugmut-extras",
    "plugmut-llm",
    "plugmut-dedup",
]

[tool.uv.sources]
plugmut = { workspace = true }
plugmut-extras = { workspace = true }
plugmut-llm = { workspace = true }
plugmut-dedup = { workspace = true }

[tool.uv.workspace]
members = ["mutmut", "mutmut-extras", "mutmut-llm", "mutmut-dedup"]
exclude = ["mutmut/e2e_projects/*"]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
exclude = [
    ".claude/worktrees/**",
    "mutmut/e2e_projects/**",
    "**/.git/**",
]
