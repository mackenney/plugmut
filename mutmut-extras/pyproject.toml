[project]
name = "mutmut-extras"
version = "0.1.0"
description = "Extra mutation operators for mutmut"
requires-python = ">=3.10"

dependencies = [
    "plugmut>=4.0.0",
    "pluggy>=1.5.0",
]

[project.entry-points.plugmut]
extras = "mutmut_extras.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_extras"]

[tool.uv.sources]
plugmut = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.13"
