[project]
name = "mutmut-extras"
version = "0.1.0"
description = "Extra mutation operators for mutmut"
requires-python = ">=3.10"
readme = "README.md"
# Recommended: BSD-3-Clause — update {{LICENSE}} when decided
license = "BSD-3-Clause"
authors = [
    # email: {{AUTHOR_EMAIL}}
    { name = "{{AUTHOR_NAME}}", email = "todo@example.com" },
]
keywords = ["mutation testing", "testing", "mutations", "pytest", "operators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "plugmut>=4.0.0",
    "pluggy>=1.5.0",
]

[project.urls]
Homepage = "{{REPO_URL}}"
Repository = "{{REPO_URL}}"
Issues = "{{REPO_URL}}/issues"

[project.entry-points.plugmut]
extras = "mutmut_extras.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_extras"]

[tool.uv.sources]
plugmut = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.20",
]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.13"
