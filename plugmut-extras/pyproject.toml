[project]
name = "plugmut-extras"
version = "0.0.1"
description = "Extra mutation operators for plugmut"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ignacio Mackenney", email = "mackenney92@gmail.com" },
]
keywords = ["mutation testing", "testing", "mutations", "pytest", "operators"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "plugmut>=4.0.0",
    "pluggy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/mackenney/plugmut"
Repository = "https://github.com/mackenney/plugmut"
Issues = "https://github.com/mackenney/plugmut/issues"

[project.entry-points.plugmut]
extras = "mutmut_extras.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_extras"]

[tool.uv.sources]
plugmut = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "ty>=0.0.34",
]



[tool.ty.src]
exclude = ["e2e_project"]

[tool.ty.analysis]
respect-type-ignore-comments = false
