[project]
name = "mutmut-llm"
version = "0.1.0"
description = "LLM-powered mutation operator for mutmut"
requires-python = ">=3.10"

dependencies = [
    "mutmut>=3.5.0",
    "pluggy>=1.5.0",
    "anthropic>=0.40.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "tqdm>=4.66.0",
]

[project.entry-points.mutmut]
llm = "mutmut_llm.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e_live: tests requiring real Anthropic API access (set MUTMUT_LLM_E2E_LIVE=1)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest-asyncio>=0.24.0",
]
