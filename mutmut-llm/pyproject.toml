[project]
name = "plugmut-llm"
version = "0.0.1"
description = "LLM-powered mutation operator for plugmut"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ignacio Mackenney", email = "mackenney92@gmail.com" },
]
keywords = ["mutation testing", "LLM", "AI", "anthropic", "testing", "mutations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "plugmut>=4.0.0",
    "pluggy>=1.5.0",
    "anthropic>=0.40.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/mackenney/plugmut"
Repository = "https://github.com/mackenney/plugmut"
Issues = "https://github.com/mackenney/plugmut/issues"

[project.entry-points.plugmut]
llm = "mutmut_llm.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e_live: tests requiring real Anthropic API access (set PLUGMUT_LLM_E2E_LIVE=1)",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest-asyncio>=0.24.0",
]
[tool.ty.environment]
python = "../.venv"

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"
pythonVersion = "3.13"
