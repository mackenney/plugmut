[project]
name = "mutmut-llm"
version = "0.1.0"
description = "LLM-powered mutation operator plugin for mutmut"
requires-python = ">=3.10"

dependencies = [
    "mutmut>=3.5.0",
    "pluggy>=1.5.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.0",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutmut_llm"]

[tool.uv.sources]
mutmut = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
